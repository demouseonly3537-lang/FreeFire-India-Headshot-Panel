plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ashxmay.ffpanel'
    compileSdk 34

    defaultConfig {
        applicationId "com.ashxmay.ffpanel"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0-india"

        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
